# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: bar.agent.config-contract
title: Set up and change the config from a script, without a terminal
binary: bar
intent: |
  An agent sets bar up for a user from a script, with no terminal to answer
  prompts. It reads what bar sees as JSON, writes a preset, repeats it,
  tries to overwrite it with another, imports a broken file and a good
  one, previews before writing, repeats each write, adds bar to a
  project's Claude Code settings, and recovers from its own mistakes
  from what bar prints.
preconditions:
  - bar binary is on PATH
  - no bar config yet
  - the working directory is a project with no .claude directory
steps:
  - id: check_none
    intent: |
      Read the config report as JSON before any config exists: which file
      bar would read, where its price data lives, and whether all is ok.
    invoke: ["bar", "check", "--format", "json"]
    capture: [exit_code, stdout]
  - id: check_yaml
    intent: |
      Read the same report as YAML, for a tool that prefers it to JSON.
    invoke: ["bar", "check", "--format", "yaml"]
    capture: [exit_code, stdout]
  - id: init_dry_run
    intent: |
      Ask init for a dry run as JSON before any config exists: the file it
      would create, with nothing written.
    invoke: ["bar", "init", "--preset", "minimal", "--dry-run", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: check_after_init_dry_run
    intent: |
      Read the report after the dry run: still no config file.
    invoke: ["bar", "check", "--format", "json"]
    capture: [exit_code, stdout]
  - id: init
    intent: |
      Write the minimal preset as the config.
    invoke: ["bar", "init", "--preset", "minimal"]
    capture: [exit_code, stdout]
  - id: init_again
    intent: |
      Run the same init again. The config is that preset already, so bar
      writes nothing, says so and succeeds.
    invoke: ["bar", "init", "--preset", "minimal"]
    capture: [exit_code, stderr]
  - id: init_other
    intent: |
      Init a different preset over the config just written. bar refuses
      to overwrite it and says so.
    invoke: ["bar", "init", "--preset", "full"]
    capture: [exit_code, stderr]
  - id: init_other_json
    intent: |
      Run that init again asking for JSON, so a script can read why it was
      refused from a structured error instead of parsing a sentence.
    invoke: ["bar", "init", "--preset", "full", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: check_config
    intent: |
      Read the report again: it names the config file and finds no issues.
    invoke: ["bar", "check", "--format", "json"]
    capture: [exit_code, stdout]
  - id: import_broken
    intent: |
      Import a config from stdin that has an unknown key. bar lists the
      error with its line number and writes nothing.
    invoke: ["bar", "config", "import", "-", "--replace", "--yes"]
    capture: [exit_code, stdout, stderr]
  - id: check_after_broken
    intent: |
      Read the report after the refused import: the config is the preset
      and still has no issues, so nothing was half written.
    invoke: ["bar", "check", "--format", "json"]
    capture: [exit_code, stdout]
  - id: import_preview
    intent: |
      Import a good config from stdin without --yes. bar shows the diff it
      would apply and asks for --yes instead of writing.
    invoke: ["bar", "config", "import", "-", "--replace"]
    capture: [exit_code, stdout, stderr]
  - id: import_apply
    intent: |
      Import the same config with --yes. bar writes it and backs up the
      old file.
    invoke: ["bar", "config", "import", "-", "--replace", "--yes"]
    capture: [exit_code, stdout]
  - id: import_repeat
    intent: |
      Import it once more. The config already matches, so nothing is
      written and the command still succeeds.
    invoke: ["bar", "config", "import", "-", "--replace", "--yes"]
    capture: [exit_code, stdout, stderr]
  - id: check_imported
    intent: |
      Read the report after the import: same file, no issues.
    invoke: ["bar", "check", "--format", "json"]
    capture: [exit_code, stdout]
  - id: install_preview
    intent: |
      Add bar to the project's Claude Code settings without --yes. bar
      prints the diff and, with no terminal to ask, tells the agent to
      rerun with --yes.
    invoke: ["bar", "install", "--project"]
    capture: [exit_code, stdout, stderr]
  - id: install_apply
    intent: |
      Run the install with --yes. bar writes the settings file.
    invoke: ["bar", "install", "--project", "--yes"]
    capture: [exit_code, stdout]
  - id: install_repeat
    intent: |
      Run the install again. The settings are already up to date, so the
      command succeeds without changing them.
    invoke: ["bar", "install", "--project", "--yes"]
    capture: [exit_code, stdout, stderr]
  - id: unknown_command
    intent: |
      Mistype a command. bar says it does not know it and points at
      bar --help and the plugin list.
    invoke: ["bar", "frobnicate"]
    capture: [exit_code, stderr]
  - id: bad_format
    intent: |
      Ask for an output format bar does not have. bar lists the formats it
      supports.
    invoke: ["bar", "check", "--format", "xml"]
    capture: [exit_code, stderr]
  - id: import_no_mode
    intent: |
      Import without saying whether to merge or replace. bar names the
      missing flag and points at --help.
    invoke: ["bar", "config", "import", "-"]
    capture: [exit_code, stderr]
  - id: plugin_list
    intent: |
      List the plugins bar finds on PATH as JSON.
    invoke: ["bar", "plugin", "list", "--format", "json"]
    capture: [exit_code, stdout]
  - id: unknown_command_json
    intent: |
      Mistype a command while asking for JSON, expecting the error class
      and the suggested fix as fields.
    invoke: ["bar", "frobnicate", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: install_repeat_json
    intent: |
      Repeat the project install asking for JSON, to read from a field
      that the settings were already up to date.
    invoke: ["bar", "install", "--project", "--yes", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: install_dry_run_json
    intent: |
      Ask the local-settings install for a dry run as JSON, --yes given
      too: the settings file it would create and the diff, and nothing
      written even with --yes.
    invoke: ["bar", "install", "--local", "--yes", "--dry-run", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: install_local_preview_json
    intent: |
      Preview adding bar to the local settings file as JSON, to read the
      planned change before deciding to write it.
    invoke: ["bar", "install", "--local", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: import_dry_run
    intent: |
      Ask the config import for a dry run, the usual way to see what a
      write would do without the confirmation prompt.
    invoke: ["bar", "config", "import", "-", "--replace", "--dry-run"]
    capture: [exit_code, stdout, stderr]
  - id: import_dry_run_json
    intent: |
      Ask for the same dry run as JSON, --yes given too: the file the
      import would update and the diff, as fields, and nothing written
      even with --yes.
    invoke: ["bar", "config", "import", "-", "--replace", "--yes", "--dry-run", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: import_after_dry_run
    intent: |
      Import the config already in place once more as JSON. The dry runs
      changed nothing, so there is nothing to write.
    invoke: ["bar", "config", "import", "-", "--replace", "--yes", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: toggle_dry_run
    intent: |
      Ask a usage view toggle for a dry run before flipping it, to see the
      view it would switch to.
    invoke: ["bar", "toggle", "5h", "--dry-run"]
    capture: [exit_code, stdout, stderr]
  - id: toggle_dry_run_json
    intent: |
      Ask for a dry run of setting the 5-hour view to percentage, as
      JSON: the view now, the view after and the state file it would
      create.
    invoke: ["bar", "toggle", "5h", "pct", "--dry-run", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: check_after_toggle_dry_run
    intent: |
      Read the report after the dry runs: the 5-hour view is still the
      bar.
    invoke: ["bar", "check", "--format", "json"]
    capture: [exit_code, stdout]
  - id: toggle_set
    intent: |
      Set the 5-hour usage view to percentage directly, so running the same
      command twice leaves the same view instead of flipping it back.
    invoke: ["bar", "toggle", "5h", "pct"]
    capture: [exit_code, stdout, stderr]
  - id: toggle_json
    intent: |
      Flip the 7-day usage view asking for JSON, to read the new view from
      a field.
    invoke: ["bar", "toggle", "7d", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: toggle_unknown
    intent: |
      Toggle a view name that is neither a usage window nor an installed
      plugin, expecting bar to reject the typo.
    invoke: ["bar", "toggle", "no-such-view"]
    capture: [exit_code, stdout, stderr]
  - id: help_json
    intent: |
      Ask for the command list as JSON, with each command's flags and
      whether it reads, writes or deletes.
    invoke: ["bar", "--help", "--format", "json"]
    capture: [exit_code, stdout]
  - id: update_json
    intent: |
      Read the version and update-check state as JSON.
      The check is off in this config, so nothing is fetched.
    invoke: ["bar", "update", "--format", "json"]
    capture: [exit_code, stdout]
  - id: export_json
    intent: |
      Read the effective config as JSON, the state every render starts
      from.
    invoke: ["bar", "config", "export", "--format", "json"]
    capture: [exit_code, stdout]
  - id: plugin_missing
    intent: |
      Ask for the details of a plugin that is not installed, expecting a
      not-found error.
    invoke: ["bar", "plugin", "info", "no-such-plugin"]
    capture: [exit_code, stderr]
  - id: prices_dry_run
    intent: |
      Ask the price update for a dry run as JSON: the file it would write,
      with nothing fetched.
    invoke: ["bar", "prices", "update", "--dry-run", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: check_after_prices_dry_run
    intent: |
      Read the report after the dry run: no price data was fetched.
    invoke: ["bar", "check", "--format", "json"]
    capture: [exit_code, stdout]
  - id: export_file_dry_run
    intent: |
      Ask the export to a file for a dry run as JSON: the file it would
      create.
    invoke: ["bar", "config", "export", "exported.conf", "--dry-run", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: export_file_after_dry_run
    intent: |
      Export to that file for real. The dry run left no file there, so
      the export is not refused.
    invoke: ["bar", "config", "export", "exported.conf", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: web_plugins_dry_run
    intent: |
      Ask the web configurator's plugin list for a dry run with -o: the
      file it would create.
    invoke: ["bar", "web", "plugins", "-o", "plugins.json", "--dry-run", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: web_plugins_after_dry_run
    intent: |
      Write that file for real. The dry run left no file there, so it is
      not refused.
    invoke: ["bar", "web", "plugins", "-o", "plugins.json"]
    capture: [exit_code, stdout, stderr]
