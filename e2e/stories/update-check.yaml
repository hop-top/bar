# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: bar.update.how-to-upgrade
title: See whether a newer bar is out and how to upgrade
binary: bar
intent: |
  A user turned on the update check in bar.conf and the status line shows
  an arrow with a newer version. They run bar update to read the running
  version, the newest release the daily check found, and the command that
  upgrades their install. bar never downloads anything itself.
preconditions:
  - bar binary is on PATH
steps:
  - id: update
    intent: |
      Print the running version, the last check result and how to upgrade.
    invoke: ["bar", "update"]
    capture: [exit_code, stdout]
