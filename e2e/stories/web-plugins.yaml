# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: bar.web.plugins-manifest
title: Write the plugin manifest for the web configurator
binary: bar
intent: |
  A user composes their status line in the web configurator, which runs in
  the browser and cannot run their bar-<name> plugins. They ask bar for a
  manifest of every plugin it finds, with option schemas and preview
  samples, and save it to a file they load into the page.
preconditions:
  - bar binary is on PATH
steps:
  - id: manifest_stdout
    intent: |
      Print the manifest of the plugins found on PATH as JSON, to check
      which plugins and samples the page will see.
    invoke: ["bar", "web", "plugins"]
    capture: [exit_code, stdout]
  - id: manifest_file
    intent: |
      Write the same manifest to plugins.json for the page to load.
    invoke: ["bar", "web", "plugins", "-o", "plugins.json"]
    capture: [exit_code]
