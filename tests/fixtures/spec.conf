set left   "#{model}#{effort} │ #{ctx} │ #{repo}:#{branch} │ #{prs[limit=3;author=@me]} │ #{issues[limit=3;assignee=@me]}"
set center "#{usage[type=5h]} │ #{usage[type=7d]} │ #{claude-credits}"
set right  "#{account}"
set gap 3
set wrap auto
set refresh 5s

default prs   limit=5 status=open link=true
default usage view=bar width=5 click=toggle
default model  click=model
default effort click=effort
default ctx    click=compact

# Fixed states: PR status, issue labels, errors.
set color.good 114
set color.warn 179
set color.bad  203
# Measured values, red to green.
set ramp "196 202 208 214 220 226 190 154 118 82 46"

account "*acme*"                 acme     141
account "*@widgets.example.org"   widgets  75
account "*@example.net"           personal 114

rule usage[type=5h] early warn=20% bad=5% final=1h bad=30%
rule usage[type=7d] early warn=20% bad=5% final=1d bad=30%
rule credits        early pace            final=3d bad=$50

plugin claude-credits org=<console-org-id> keychain=claude-console-session-<label> ttl=5m
