[package]
name = "bar-tray"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "Apache-2.0"
description = "Desktop menu bar / tray companion for bar: its toggles and plugin actions as a native menu"
authors = ["Jad Bitar <jadb@users.noreply.github.com>"]

[lib]
name = "bar_tray"
path = "src/lib.rs"

[[bin]]
name = "bar-tray"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
muda = { version = "=0.21.2", default-features = false }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
