[package]
name = "bar-tray"
version = "0.1.0-rc.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "Apache-2.0"
description = "Desktop menu bar / tray companion for bar: its toggles and plugin actions as a native menu"
authors = ["Jad Bitar <jadb@users.noreply.github.com>"]

[lib]
name = "bar_tray"
path = "src/lib.rs"

[[bin]]
name = "bar-tray"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# Linux StatusNotifierItem backend. Off by default: ksni (Unlicense) pulls
# zbus 5, whose advisories `cargo deny` reports until ksni moves to zbus 6.
linux-sni = ["dep:ksni"]

[dependencies]
bar-plugin = { path = "../bar-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# never the default features: they pull GTK and libappindicator on Linux
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
muda = { version = "=0.21.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.7", default-features = false, features = ["async-io", "blocking"], optional = true }
