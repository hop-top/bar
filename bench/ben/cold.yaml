name: statusline-cold
description: "Status-line tools, cold: tool HOME reset to config only before every run"
version: 1

task:
  prompt: "Render one Claude Code status line from the stdin fixture"
  input:
    slb: /opt/slbench

runs: 30
warmup: 0
aggregate: median

# ben has no per-candidate env: /usr/bin/env sets HOME (per-tool isolation) and COLUMNS,
# then execs the tool, so rusage still covers the tool process itself (env never waits).
candidates:
  - name: bar
    adapter: cli
    cmd: /usr/bin/env
    args: ["HOME={{input.slb}}/home/bar", "COLUMNS=200", "{{input.slb}}/bar/target/release/bar", "render"]
    input_file: "{{input.slb}}/work/session.json"
    prepare: "{{input.slb}}/bench/run.sh _reset bar"
  - name: ccstatusline
    adapter: cli
    cmd: /usr/bin/env
    args: ["HOME={{input.slb}}/home/ccstatusline", "COLUMNS=200", "ccstatusline"]
    input_file: "{{input.slb}}/work/session.json"
    prepare: "{{input.slb}}/bench/run.sh _reset ccstatusline"
  - name: claude-powerline
    adapter: cli
    cmd: /usr/bin/env
    args: ["HOME={{input.slb}}/home/claude-powerline", "COLUMNS=200", "claude-powerline"]
    input_file: "{{input.slb}}/work/session.json"
    prepare: "{{input.slb}}/bench/run.sh _reset claude-powerline"
  - name: ccline
    adapter: cli
    cmd: /usr/bin/env
    args: ["HOME={{input.slb}}/home/ccline", "COLUMNS=200", "{{input.slb}}/home/ccline/.claude/ccline/ccline"]
    input_file: "{{input.slb}}/work/session.json"
    prepare: "{{input.slb}}/bench/run.sh _reset ccline"
  - name: bar-notokens
    adapter: cli
    cmd: /usr/bin/env
    args: ["HOME={{input.slb}}/home/bar-notokens", "COLUMNS=200", "{{input.slb}}/bar/target/release/bar", "render"]
    input_file: "{{input.slb}}/work/session.json"
    prepare: "{{input.slb}}/bench/run.sh _reset bar-notokens"
  - name: bar-subagent
    adapter: cli
    cmd: /usr/bin/env
    args: ["HOME={{input.slb}}/home/bar", "COLUMNS=200", "{{input.slb}}/bar/target/release/bar", "subagent"]
    input_file: "{{input.slb}}/work/subagent.json"
    prepare: "{{input.slb}}/bench/run.sh _reset bar"
  - name: ccline-subagent
    adapter: cli
    cmd: /usr/bin/env
    args: ["HOME={{input.slb}}/home/ccline", "COLUMNS=200", "{{input.slb}}/home/ccline/.claude/ccline/ccline"]
    input_file: "{{input.slb}}/work/subagent.json"
    prepare: "{{input.slb}}/bench/run.sh _reset ccline"

metrics:
  - latency_ms
  - cpu_ms
  - cpu_user_ms
  - cpu_sys_ms
  - max_rss_kb

scorer:
  strategy: single:latency_ms

registry:
  push: false
