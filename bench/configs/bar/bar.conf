# Benchmark layout: model, context %, git branch + dirty, session cost, 5h and 7d usage
# (used % + time to reset), session duration, token totals. Plain skin, no icons, no links.
set skin plain
set icons none
set left "#{model[click=none]} │ #{ctx[click=none]} │ #{branch[link=off]} #{dirty} │ #{cost} │ #{usage[type=5h;show=pct,time;count=used;click=none]} │ #{usage[type=7d;show=pct,time;count=used;click=none]} │ #{duration} │ #{tokens}"
