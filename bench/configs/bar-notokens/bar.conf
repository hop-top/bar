# Like-for-like with ccline: bar layout minus token totals (ccline has no session token metric).
# Same segments as configs/bar otherwise; skin and icons identical.
set skin plain
set icons none
set left "#{model[click=none]} │ #{ctx[click=none]} │ #{branch[link=off]} #{dirty} │ #{cost} │ #{usage[type=5h;show=pct,time;count=used;click=none]} │ #{usage[type=7d;show=pct,time;count=used;click=none]} │ #{duration}"
