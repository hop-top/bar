# cargo-deny policy for `make audit`. Reference:
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[advisories]
# Every RustSec advisory fails, including unmaintained and yanked
# crates. Ignore one only with its ID and a reason:
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "..." }]
ignore = []

[licenses]
# Permissive licenses only, exactly those the dependency tree carries.
# Adding one is a licensing decision, not a build fix.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# workspace members depend on each other by path
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
