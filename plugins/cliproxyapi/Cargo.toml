[package]
name = "bar-cliproxyapi"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "bar plugin: per-account quota of a CLIProxyAPI proxy"
authors = ["Jad Bitar <jadb@users.noreply.github.com>"]

[lib]
name = "bar_cliproxyapi"
path = "src/lib.rs"

[[bin]]
name = "bar-cliproxyapi"
path = "src/main.rs"

[features]
# tests only: `BAR_CLIPROXYAPI_CHOOSER` names a program that stands in for
# the macOS chooser. Refused in release builds.
test-tools = []

[lints]
workspace = true

[dependencies]
bar-plugin = { path = "../../crates/bar-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
hop-bar = { path = "../..", package = "hop-bar" }
