# powerline: segments on coloured backgrounds joined by arrows
# needs a Nerd Font or Powerline-patched font; `set skin-glyphs ascii` otherwise
set skin powerline
set palette nord
set icons nerdfont
set left "#{model}#{effort} │ #{ctx} │ #{repo}:#{branch}"
set center "#{usage[type=5h]} │ #{usage[type=7d]}"
set right "#{account}"
