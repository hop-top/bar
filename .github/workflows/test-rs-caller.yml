# Generated by `kit init`. Edits will not be overwritten;
# kit will surface conflicting refreshes as `.kit-suggested` siblings.
# Runs `make check` on Linux and macOS; Windows runs clippy and tests;
# the static musl build is checked on Linux.

name: CI

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Check
        run: make check

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --no-fail-fast --features test-tools

  # The release's static Linux build, checked before a tag needs it.
  musl:
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - name: Build
        run: cargo build --locked --target "$TARGET"
      - name: Static binary
        run: |
          set -euo pipefail
          bin="target/${TARGET}/debug/bar"
          if readelf -lW "$bin" | grep -q 'INTERP' || readelf -dW "$bin" | grep -q '(NEEDED)'; then
            echo "$bin is not statically linked" >&2
            exit 1
          fi
