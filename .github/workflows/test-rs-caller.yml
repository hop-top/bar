# Generated by `kit init`. Edits will not be overwritten;
# kit will surface conflicting refreshes as `.kit-suggested` siblings.
# Runs `make check` on Linux and macOS; Windows runs clippy and tests for
# the whole workspace (bar and its plugin) and type-checks arm64; the
# static musl build of both binaries is checked on Linux.

name: CI

on:
  pull_request:
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Check
        run: make check

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --target aarch64-pc-windows-msvc && rustup default stable
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast --features hop-bar/test-tools,bar-cliproxyapi/test-tools
      - name: Type-check arm64
        run: cargo check --locked --workspace --target aarch64-pc-windows-msvc

  # The release's static Linux build, checked before a tag needs it.
  musl:
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - name: Build
        run: cargo build --locked --workspace --target "$TARGET"
      - name: Static binary
        run: |
          set -euo pipefail
          for name in bar bar-cliproxyapi; do
            bin="target/${TARGET}/debug/${name}"
            if readelf -lW "$bin" | grep -q 'INTERP' || readelf -dW "$bin" | grep -q '(NEEDED)'; then
              echo "$bin is not statically linked" >&2
              exit 1
            fi
          done
