# Generated by `kit init`. Edits will not be overwritten;
# kit will surface conflicting refreshes as `.kit-suggested` siblings.
# Attaches prebuilt binaries to the GitHub release. The crate is not
# published to crates.io (Cargo.toml: publish = false).

name: release-rs-caller

on:
  push:
    tags: ['*/v*', 'v*']

permissions:
  contents: read
  id-token: write

jobs:
  # Prebuilt binaries, one native runner per target, attached to the
  # GitHub release for the tag. Asset: bar-<version>-<target>.tar.gz
  # holding `bar`, plus a .sha256 file.
  binaries:
    if: startsWith(github.ref_name, 'v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="bar-${TAG#v}-${TARGET}"
          tar -C "target/${TARGET}/release" -czf "${name}.tar.gz" bar
          if command -v sha256sum >/dev/null; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" bar-*.tar.gz bar-*.tar.gz.sha256 --clobber
