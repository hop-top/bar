# Generated by `kit init`. Edits will not be overwritten;
# kit will surface conflicting refreshes as `.kit-suggested` siblings.
# Attaches prebuilt binaries to the GitHub release. The crate is not
# published to crates.io (Cargo.toml: publish = false).

name: release-rs-caller

on:
  push:
    tags: ['*/v*', 'v*']

permissions: {}

jobs:
  # Creates the release once; matrix jobs only upload to it.
  create-release:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # A release ships only with a `make bench` run recorded for its inputs
      # (docs/technical.md#releasing). Fails before any release or upload.
      - name: Benchmarks match the release's inputs
        run: make bench-check
      - name: Check tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crate="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "${TAG#v}" != "$crate" ]; then
            echo "tag $TAG does not match Cargo.toml version $crate" >&2
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes $flags

  # Prebuilt binaries, one native runner per target. Asset:
  # bar-<version>-<target>.tar.gz holding `bar`, plus a .sha256 file;
  # .zip holding `bar.exe` for Windows (arm64 cross-built on the x64 runner with MSVC).
  # Linux gnu builds on ubuntu-22.04 (glibc 2.35) so they run on glibc >= 2.35;
  # the musl builds are static and run on any Linux of that architecture.
  # The arm Linux runner needs a plan/repo that provides it.
  binaries:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
          - { target: aarch64-pc-windows-msvc, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      # musl: no program interpreter and no shared libraries, or the build fails.
      - name: Static binary
        if: endsWith(matrix.target, '-musl')
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/bar"
          file "$bin"
          if readelf -lW "$bin" | grep -q 'INTERP' || readelf -dW "$bin" | grep -q '(NEEDED)'; then
            echo "$bin is not statically linked" >&2
            exit 1
          fi
      - name: Package
        run: |
          set -euo pipefail
          name="bar-${TAG#v}-${TARGET}"
          case "$TARGET" in
            *-windows-*)
              asset="${name}.zip"
              7z a -tzip "$asset" "./target/${TARGET}/release/bar.exe"
              ;;
            *)
              asset="${name}.tar.gz"
              tar -czf "$asset" -C "target/${TARGET}/release" bar
              ;;
          esac
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" --clobber
