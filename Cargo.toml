[package]
name = "hop-bar"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Configurable status line for Claude Code: tmux-style format, placeholders, plugins"
authors = ["Jad Bitar <jadb@users.noreply.github.com>"]

[[bin]]
name = "bar"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
hop-top-kit = { version = "=0.5.0-alpha.6", features = ["cli", "config"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
