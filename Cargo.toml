[package]
name = "hop-bar"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Fast, configurable and extensible status line for Claude Code"
authors = ["Jad Bitar <jadb@users.noreply.github.com>"]

[[bin]]
name = "bar"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
libc = "=0.2.191"
memchr = "2"
hop-top-kit = { version = "=0.5.0-alpha.6", features = ["cli", "config"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "=0.2.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
