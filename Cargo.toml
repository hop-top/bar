[package]
name = "hop-bar"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Fast, configurable and extensible status line for Claude Code"
authors = ["Jad Bitar <jadb@users.noreply.github.com>"]

[[bin]]
name = "bar"
path = "src/main.rs"

[workspace]
members = [".", "crates/bar-plugin", "plugins/cliproxyapi", "plugins/routellm"]
resolver = "2"

[features]
default = ["edit"]
# `bar edit`, the terminal config editor
edit = ["dep:ratatui", "dep:crossterm"]
# tests only: `curl` and `security` for the usage API come from `PATH`
# (absolute entries) instead of fixed system paths, so tests can fake them.
# Refused in release builds.
test-tools = []

[dependencies]
bar-plugin = { path = "crates/bar-plugin" }
clap = { version = "4", features = ["derive", "string"] }
memchr = "2"
hop-top-kit = { version = "=0.5.0-alpha.6", features = ["cli", "config"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "=0.29.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "fat"
codegen-units = 1
