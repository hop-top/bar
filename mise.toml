# Tools behind `make quality` and `make mutation`; install with `mise install`.
# Exact pins. `npm:` needs Node on PATH; Rust comes from rustup
# (`llvm-tools-preview` is the extra component `make coverage` needs).
[tools]
cargo-deny = "0.20.2"
cargo-binstall = "1.26.1"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-llvm-cov" = "0.9.1"
"cargo:cargo-mutants" = "27.1.0"
"npm:jscpd" = "5.4.2"
